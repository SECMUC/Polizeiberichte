name: Täglich Polizeidaten aktualisieren

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 05:00 CET / 06:00 MESZ
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Welcher Scraper? (all / muenchen / obn / obs / swn / merge)'
        required: false
        default: 'all'

jobs:
  scrape-muenchen:
    if: >
      github.event.inputs.scraper == 'all' ||
      github.event.inputs.scraper == 'muenchen' ||
      github.event.inputs.scraper == '' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scraper_muenchen.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/incidents_muenchen.json
          git diff --staged --quiet || git commit -m "PP München $(date '+%d.%m.%Y %H:%M')"
          git push

  scrape-obn:
    if: >
      github.event.inputs.scraper == 'all' ||
      github.event.inputs.scraper == 'obn' ||
      github.event.inputs.scraper == '' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scraper_obn.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/incidents_obn.json
          git diff --staged --quiet || git commit -m "PP OBN $(date '+%d.%m.%Y %H:%M')"
          git push

  scrape-obs:
    if: >
      github.event.inputs.scraper == 'all' ||
      github.event.inputs.scraper == 'obs' ||
      github.event.inputs.scraper == '' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scraper_obs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/incidents_obs.json
          git diff --staged --quiet || git commit -m "PP OBS $(date '+%d.%m.%Y %H:%M')"
          git push

  scrape-swn:
    if: >
      github.event.inputs.scraper == 'all' ||
      github.event.inputs.scraper == 'swn' ||
      github.event.inputs.scraper == '' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scraper_swn.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/incidents_swn.json
          git diff --staged --quiet || git commit -m "PP SWN $(date '+%d.%m.%Y %H:%M')"
          git push

  merge:
    needs: [scrape-muenchen, scrape-obn, scrape-obs, scrape-swn]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Neuesten Stand holen
        run: git pull origin main
      - name: Merge ausführen
        run: python merge.py
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/meta.json
          git diff --staged --quiet || git commit -m "Merge $(date '+%d.%m.%Y %H:%M')"
          git push origin main
